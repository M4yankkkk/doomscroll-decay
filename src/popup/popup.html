<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Doomscroll Decay</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app" id="app">
    <header class="top">
      <div class="brand">
        <img src="../../assets/icons/icon.svg" width="22" height="22" alt="">
        <span>Doomscroll Decay</span>
      </div>
      <span class="demo-pill" id="demoPill" hidden>Demo · 60×</span>
      <button class="icon-btn" id="settings" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
          <circle cx="16" cy="7" r="2"/>
          <circle cx="8" cy="17" r="2"/>
        </svg>
      </button>
    </header>

    <section class="hero">
      <p class="eyebrow" id="eyebrow">Today on feeds</p>
      <p class="total" id="total">0s</p>
      <p class="stage">
        <span class="stage-name" id="stageName">Fresh</span>
        <span class="stage-line" id="stageLine"></span>
      </p>
    </section>

    <section class="meter" aria-label="Decay progress">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="ticks" id="ticks"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="tick-labels" id="tickLabels"></div>
      <p class="next" id="next"></p>
    </section>

    <section class="sites">
      <p class="eyebrow">By site</p>
      <ul class="site-list" id="siteList"></ul>
    </section>

    <label class="toggle-row">
      <span class="toggle-copy">
        <strong>Demo mode</strong>
        <small>Time runs 60× faster for screen recording</small>
      </span>
      <input type="checkbox" id="demo" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <footer class="foot">
      <button class="ghost-btn" id="reset" type="button">Reset today</button>
      <span class="privacy">Counts only while you scroll.<br>Nothing leaves this device.</span>
    </footer>
  </main>

  <script src="../shared/config.js"></script>
  <script src="../shared/decay-curve.js"></script>
  <script src="popup.js"></script>
</body>
</html>
